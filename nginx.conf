server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip: dynamic compression for text assets ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/wasm;

    # ── Gzip: serve pre-compressed .gz files for EGF assets ──
    gzip_static on;

    # EGF game assets — pre-compressed, long cache
    location ~* \.egf$ {
        expires 30d;
        add_header Cache-Control "public";
        gzip_static on;
        try_files $uri =404;
    }

    # Cache static assets (images, fonts, audio, wasm)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|bmp|wav|mp3|ogg|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # WebSocket proxy to game server (production)
    location /ws {
        proxy_pass http://game.endless-memories.net:8077;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # WebSocket proxy to test game server
    location /ws-test {
        proxy_pass http://game.endless-memories.net:8073;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Dashboard API proxy (weapon auras, etc.)
    location /api/ {
        proxy_pass http://game.endless-memories.net:8079/api/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # index.html — never cache so deploys take effect immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Handle SPA routing - fallback to index.html
    location / {
        rewrite ^(.+)/$ $1 permanent;
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
